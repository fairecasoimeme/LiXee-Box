## IDF Component Manager - Dependances du projet
## https://components.espressif.com
##
## Installation : les composants sont telecharges automatiquement
## au premier 'idf.py build' dans managed_components/
dependencies:

  ## SDK Matter Espressif (ConnectedHomeIP / CHIP)
  ## Inclut : esp_matter, esp_matter_core, chip
  espressif/esp_matter:
    version: ">=1.3.0"
    rules:
      - if: "idf_version >=5.3"

  ## LittleFS pour ESP-IDF (stockage configs + fichiers web)
  joltwallet/littlefs:
    version: "^1.14.0"

  ## mDNS (decouverte reseau, requis par Matter)
  espressif/mdns:
    version: "^1.2.0"
