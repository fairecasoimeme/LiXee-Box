; Mini-projet ISOLÉ pour tester la communication SPI avec le module LoRa 2.4 GHz SX1281.
; Ne touche pas au firmware principal de la LiXee-Box.
;
; Build/upload depuis la racine du projet principal :
;   pio run  -d recepteur/sx1281_spi_test -t upload
;   pio device monitor -b 115200
; ou ouvrir directement ce dossier comme projet PlatformIO.

[env:sx1281_test]
platform = espressif32
board = esp32LixeeTft
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCORE_DEBUG_LEVEL=3
lib_deps =
	jgromes/RadioLib @ ^7.1.0
